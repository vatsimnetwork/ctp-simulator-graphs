{{if not .HasRevision}}
<div class="empty-state">No revision data available.</div>
{{else if not .Facilities}}
<div class="empty-state">No en route timing data available.</div>
{{else}}
<div class="filter-bar">
  <select class="page-selector" id="enroute-facility-selector">
    {{range $i, $f := .Facilities}}
    <option value="{{$f.Name}}"{{if eq $i 0}} selected{{end}}>{{$f.Name}} (peak {{$f.Peak}})</option>
    {{end}}
  </select>
</div>

{{range $fi, $f := .Facilities}}
<div class="enroute-group" id="enroute-{{$f.Name}}" {{if ne $fi 0}}style="display:none"{{end}}>
  <div class="timing-chart-wrap">
    <canvas class="auto-chart" id="enroute-canvas-{{$fi}}" data-series="{{$f.TimeSeriesJSON}}" data-labels="{{$f.TimeLabelsJSON}}" data-max="{{$f.MaxAcPerHour}}"></canvas>
  </div>
  <table class="data-table">
    <tbody>
      <tr class="data-row">
        <td>Peak</td>
        <td class="num">{{$f.Peak}} aircraft at {{$f.PeakLabel}}</td>
      </tr>
    </tbody>
  </table>
</div>
{{end}}
{{end}}
