{{if not .HasRevision}}
<div class="empty-state">No revision data available.</div>
{{else}}
<div class="filter-bar">
  <input class="filter-input" type="text" placeholder="Filter {{.ItemLabel}}..." data-filter-table="throughput-table" autocomplete="off">
  <span class="filter-count" id="throughput-table-count">{{len .Entries}} of {{len .Entries}}</span>
</div>
<table class="data-table" id="throughput-table">
  <thead>
    <tr>
      <th data-sort="name">{{.ColumnLabel}}</th>
      <th data-sort="max">Max</th>
      <th data-sort="alloc">Allocated</th>
      <th data-sort="util">Util %</th>
    </tr>
  </thead>
  <tbody>
    {{range $i, $e := .Entries}}
    <tr class="data-row{{if $e.HasTimeSeries}} expand-row{{end}}" {{if $e.HasTimeSeries}}data-chart-row="tp-chart-{{$i}}"{{end}}>
      <td data-col="name">{{$e.Name}}</td>
      <td class="num" data-col="max" data-value="{{$e.MaxSlots}}">{{$e.MaxSlots}}</td>
      <td class="num" data-col="alloc" data-value="{{$e.Allocated}}">{{$e.Allocated}}</td>
      <td class="num {{utilClass $e.UtilPct}}" data-col="util" data-value="{{$e.UtilPct}}">{{printf "%.1f" $e.UtilPct}}%</td>
    </tr>
    {{if $e.HasTimeSeries}}
    <tr class="chart-row" id="tp-chart-{{$i}}">
      <td colspan="4">
        <div class="chart-container">
          <canvas id="tp-canvas-{{$i}}" data-series="{{$e.TimeSeriesJSON}}" data-labels="{{$e.TimeLabelsJSON}}" data-max="{{$e.MaxAcPerHour}}"></canvas>
        </div>
      </td>
    </tr>
    {{end}}
    {{end}}
  </tbody>
</table>
{{end}}
