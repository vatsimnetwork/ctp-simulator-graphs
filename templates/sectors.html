{{if not .HasRevision}}
<div class="empty-state">No revision data available.</div>
{{else}}

<div class="sectors-subnav">
  <a class="sectors-subnav__tab{{if eq .ActivePage "sectors-total"}} active{{end}}" href="{{.BasePath}}/sectors{{.EventQuery}}">Total Occupancy</a>
  <a class="sectors-subnav__tab{{if eq .ActivePage "sectors-peak"}} active{{end}}" href="{{.BasePath}}/sectors/peak{{.EventQuery}}">Max Occupancy</a>
</div>

<div class="sectors-layout">

  <div class="detail-panel" id="sector-detail" style="display:none">
    <div class="detail-panel__header">
      <span id="sector-detail-title">—</span>
      <div class="chart-toggle">
        <button class="chart-toggle-btn active" id="sector-toggle-bar">Bar</button>
        <button class="chart-toggle-btn" id="sector-toggle-line">Line</button>
        <button class="detail-action-btn" id="sector-fine-btn" style="display:none">Load 2-min</button>
      </div>
    </div>
    <div class="detail-panel__body">
      <div id="sector-no-timings" class="empty-state" style="display:none">NO timings available</div>
      <div class="detail-chart-wrap" id="sector-chart-wrap">
        <canvas id="sector-chart-canvas"></canvas>
      </div>
    </div>
  </div>

  <div class="sector-search-wrap">
    <input type="text" class="filter-input" id="sector-search-input" placeholder="Search sectors...">
    <span class="sector-search-count" id="sector-search-count"></span>
  </div>

  <div class="card-grid" id="sector-grid">
    {{range $i, $s := .Sectors}}
    <div class="grid-card grid-card--{{$s.CardClass}} sector-card"
         data-idx="{{$i}}"
         data-name="{{$s.Identifier}}"
         data-has-timings="{{$s.HasTimings}}"
         data-series="{{$s.TimeSeriesJSON}}"
         data-labels="{{$s.TimeLabelsJSON}}"
         data-max="{{$s.RefLine}}">
      <div class="grid-card__name">{{$s.Identifier}}</div>
      {{if $s.HasTimings}}
      <div class="grid-card__sub">Peak: {{$s.Peak}} @ {{$s.PeakLabel}}</div>
      {{else}}
      <div class="grid-card__sub">No timing data</div>
      {{end}}
      <div class="grid-card__util">{{printf "%.1f" $s.UtilPct}}%</div>
    </div>
    {{end}}
  </div>

</div>

{{end}}
