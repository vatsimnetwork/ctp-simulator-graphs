{{if not .HasRevision}}
<div class="empty-state">No revision data available.</div>
{{else}}

<style>
  html, body { height: 100%; overflow: hidden; }
  .page { height: calc(100vh - 48px); overflow: hidden; display: flex; flex-direction: column; padding-bottom: 0; }
</style>

<div class="sectors-layout">

  <div class="detail-panel" id="sector-detail" style="display:none">
    <div class="detail-panel__header">
      <span id="sector-detail-title">—</span>
    </div>
    <div class="detail-panel__body">
      <div id="sector-no-timings" class="empty-state" style="display:none">NO timings available</div>
      <div class="detail-chart-wrap" id="sector-chart-wrap">
        <canvas id="sector-chart-canvas"></canvas>
      </div>
    </div>
  </div>

  <div class="sectors-grid-scroll">
    <div class="card-grid" id="sector-grid">
      {{range $i, $s := .Sectors}}
      <div class="grid-card grid-card--{{$s.CardClass}} sector-card"
           data-idx="{{$i}}"
           data-name="{{$s.Identifier}}"
           data-has-timings="{{$s.HasTimings}}"
           data-series="{{$s.TimeSeriesJSON}}"
           data-labels="{{$s.TimeLabelsJSON}}"
           data-max="{{$s.MaxAcPerHour}}">
        <div class="grid-card__name">{{$s.Identifier}}</div>
        {{if $s.HasTimings}}
        <div class="grid-card__sub">Peak: {{$s.Peak}} @ {{$s.PeakLabel}}</div>
        {{else}}
        <div class="grid-card__sub">No timing data</div>
        {{end}}
        <div class="grid-card__util">{{printf "%.1f" $s.UtilPct}}%</div>
      </div>
      {{end}}
    </div>
  </div>

</div>

{{end}}
