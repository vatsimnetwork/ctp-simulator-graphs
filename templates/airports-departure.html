{{if not .HasRevision}}
<div class="empty-state">No revision data available.</div>
{{else}}

<div class="departures-layout">

  <div class="detail-panel" id="dep-detail" style="display:none">
    <div class="detail-panel__header">
      <span id="dep-detail-title">—</span>
      <div class="chart-toggle">
        <button class="chart-toggle-btn active" id="dep-toggle-list">List</button>
        <button class="chart-toggle-btn" id="dep-toggle-line">Line</button>
        <button class="detail-action-btn" id="dep-fine-btn" style="display:none">Load 2-min</button>
      </div>
    </div>
    <div class="detail-panel__body">
      <div id="dep-list-wrap">
        <table class="slot-table">
          <thead>
            <tr>
              <th>Departing</th>
              <th>Arriving</th>
              <th>Departure Time</th>
              <th>Calculated Arrival</th>
            </tr>
          </thead>
          <tbody id="dep-slot-tbody"></tbody>
        </table>
      </div>
      <div class="detail-chart-wrap" id="dep-chart-wrap" style="display:none">
        <canvas id="dep-chart-canvas"></canvas>
      </div>
    </div>
  </div>

  <div class="card-grid" id="dep-airport-grid">
    {{range $i, $ap := .Airports}}
    <div class="grid-card grid-card--{{$ap.CardClass}} dep-airport-card"
         data-idx="{{$i}}"
         data-name="{{$ap.Name}}"
         data-slots='{{$ap.SlotsJSON}}'>
      <div class="grid-card__name">{{$ap.Name}}</div>
      <div class="grid-card__sub">{{$ap.SlotsAllocated}} slots</div>
      <div class="grid-card__util">{{printf "%.1f" $ap.UtilPct}}%</div>
    </div>
    {{end}}
  </div>

</div>

{{end}}
